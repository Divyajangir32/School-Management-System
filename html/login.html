<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Green Valley Public School Jalandhar</title>
  <meta name="description" content="Secure portal login for Green Valley Public School, Jalandhar with Role-Based Access Control.">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #e2e8f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 500px;
    }
    .login-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #064e3b 0%, #047857 100%);
      color: #ffffff;
      padding: 24px 20px;
      text-align: center;
    }
    .login-logo {
      width: 58px;
      height: 58px;
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 3px;
      margin-bottom: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .login-header h1 {
      font-size: 1.35rem;
      color: #ffffff;
      margin-bottom: 2px;
    }
    .login-header p {
      font-size: 0.8rem;
      color: #a7f3d0;
    }
    .role-tabs-wrap {
      background: #f1f5f9;
      padding: 6px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .role-tabs {
      display: flex;
      gap: 4px;
      min-width: 560px;
    }
    .role-tab {
      padding: 7px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      text-align: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-muted);
      transition: var(--transition);
      white-space: nowrap;
      flex: 1;
    }
    .role-tab.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .login-body {
      padding: 22px 24px;
    }
    .demo-accounts {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-top: 18px;
    }
    .demo-accounts h4 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .demo-btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .demo-pill-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 6px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: left;
      transition: var(--transition);
    }
    .demo-pill-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .env-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 12px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: #065f46;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="../assets/images/logo.svg" alt="GVPS Logo" class="login-logo">
        <h1>Green Valley Public School</h1>
        <p>Urban Estate Phase II, Jalandhar &bull; RBAC Academic Portal</p>
      </div>

      <!-- Scrollable Role Selector Tabs for all 9 Roles -->
      <div class="role-tabs-wrap">
        <div class="role-tabs" id="role-tabs">
          <button type="button" class="role-tab active" data-role="Admin">Admin</button>
          <button type="button" class="role-tab" data-role="Super Admin">Super Admin</button>
          <button type="button" class="role-tab" data-role="Principal">Principal</button>
          <button type="button" class="role-tab" data-role="Teacher">Teacher</button>
          <button type="button" class="role-tab" data-role="Student">Student</button>
          <button type="button" class="role-tab" data-role="Parent">Parent</button>
          <button type="button" class="role-tab" data-role="Accountant">Accountant</button>
          <button type="button" class="role-tab" data-role="Librarian">Librarian</button>
          <button type="button" class="role-tab" data-role="Receptionist">Receptionist</button>
        </div>
      </div>

      <div class="login-body">
        <div class="env-banner">
          <span>Mode: <strong id="env-mode-text">Local Dev (Offline Simulator)</strong></span>
          <span class="badge badge-success" id="env-status-badge">RBAC Active</span>
        </div>

        <form id="login-form">
          <input type="hidden" id="login-role" value="Admin">

          <div class="form-group">
            <label class="form-label" for="login-email">Registered Email ID <span class="required">*</span></label>
            <input type="email" id="login-email" class="form-control" placeholder="admin@greenvalleyschool.example" required value="admin@greenvalleyschool.example">
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <label class="form-label" for="login-password" style="margin-bottom: 0;">Password <span class="required">*</span></label>
              <span style="font-size: 0.75rem; color: var(--text-muted);">Standard: [Role]@123</span>
            </div>
            <input type="password" id="login-password" class="form-control" placeholder="Enter password" required value="Admin@123">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px;" id="login-submit-btn">
            <span>Sign In to Portal</span>
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
        </form>

        <!-- 9 Quick Demo Accounts Switcher -->
        <div class="demo-accounts">
          <h4>
            <span>Quick Demo Accounts (9 Roles)</span>
            <span style="font-size: 0.68rem; font-weight: 500; text-transform: none;">Click to test role</span>
          </h4>
          <div class="demo-btn-grid">
            <button type="button" class="demo-pill-btn" onclick="fillDemo('Super Admin', 'superadmin@greenvalleyschool.example', 'Super@123')">
              <strong>Super Admin</strong><br><span class="text-muted">S. Tarlochan S.</span>
            </button>
            <button type="button" class="demo-pill-btn" onclick="fillDemo('Admin', 'admin@greenvalleyschool.example', 'Admin@123')">
              <strong>Admin</strong><br><span class="text-muted">Dr. Ahluwalia</span>
            </button>
            <button type="button" class="demo-pill-btn" onclick="fillDemo('Principal', 'principal@greenvalleyschool.example', 'Principal@123')">
              <strong>Principal</strong><br><span class="text-muted">Mrs. Sandhu</span>
            </button>
            <button type="button" class="demo-pill-btn" onclick="fillDemo('Teacher', 'harpreet.singh@greenvalleyschool.example', 'Teacher@123')">
              <strong>Teacher</strong><br><span class="text-muted">H. S. Sandhu</span>
            </button>
            <button type="button" class="demo-pill-btn" onclick="fillDemo('Student', 'arshdeep.singh@greenvalleyschool.example', 'Student@123')">
              <strong>Student</strong><br><span class="text-muted">Arshdeep Singh</span>
            </button>
            <button type="button" class="demo-pill-btn" onclick="fillDemo('Parent', 'gurmeet.singh@greenvalleyschool.example', 'Parent@123')">
              <strong>Parent</strong><br><span class="text-muted">Gurmeet Singh</span>
            </button>
            <button type="button" class="demo-pill-btn" onclick="fillDemo('Accountant', 'accountant@greenvalleyschool.example', 'Accountant@123')">
              <strong>Accountant</strong><br><span class="text-muted">R. Mahajan</span>
            </button>
            <button type="button" class="demo-pill-btn" onclick="fillDemo('Librarian', 'librarian@greenvalleyschool.example', 'Librarian@123')">
              <strong>Librarian</strong><br><span class="text-muted">Satnam Singh</span>
            </button>
            <button type="button" class="demo-pill-btn" onclick="fillDemo('Receptionist', 'receptionist@greenvalleyschool.example', 'Receptionist@123')">
              <strong>Receptionist</strong><br><span class="text-muted">Simranjeet K.</span>
            </button>
          </div>
        </div>

        <div style="text-align: center; margin-top: 16px;">
          <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);">&larr; Back to School Website</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const roleTabs = document.querySelectorAll('.role-tab');
    const roleInput = document.getElementById('login-role');
    const emailInput = document.getElementById('login-email');
    const passInput = document.getElementById('login-password');

    roleTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        roleTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const r = tab.getAttribute('data-role');
        roleInput.value = r;

        switch(r) {
          case 'Super Admin': fillDemo('Super Admin', 'superadmin@greenvalleyschool.example', 'Super@123'); break;
          case 'Admin': fillDemo('Admin', 'admin@greenvalleyschool.example', 'Admin@123'); break;
          case 'Principal': fillDemo('Principal', 'principal@greenvalleyschool.example', 'Principal@123'); break;
          case 'Teacher': fillDemo('Teacher', 'harpreet.singh@greenvalleyschool.example', 'Teacher@123'); break;
          case 'Student': fillDemo('Student', 'arshdeep.singh@greenvalleyschool.example', 'Student@123'); break;
          case 'Parent': fillDemo('Parent', 'gurmeet.singh@greenvalleyschool.example', 'Parent@123'); break;
          case 'Accountant': fillDemo('Accountant', 'accountant@greenvalleyschool.example', 'Accountant@123'); break;
          case 'Librarian': fillDemo('Librarian', 'librarian@greenvalleyschool.example', 'Librarian@123'); break;
          case 'Receptionist': fillDemo('Receptionist', 'receptionist@greenvalleyschool.example', 'Receptionist@123'); break;
        }
      });
    });

    function fillDemo(role, email, pass) {
      roleInput.value = role;
      emailInput.value = email;
      passInput.value = pass;
      roleTabs.forEach(t => {
        t.classList.toggle('active', t.getAttribute('data-role') === role);
      });
    }

    if (APP_CONFIG.USE_AWS_BACKEND) {
      document.getElementById('env-mode-text').textContent = 'AWS Production (Cognito)';
      document.getElementById('env-status-badge').textContent = 'Cloud Active';
      document.getElementById('env-status-badge').className = 'badge badge-info';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('login-submit-btn');
      const email = emailInput.value.trim();
      const pass = passInput.value;
      const role = roleInput.value;

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Verifying role credentials...</span>';
        
        const user = await Auth.login(email, pass, role);
        Utils.showToast(`Authenticated as ${user.role} (${user.name})`, 'success');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } catch (err) {
        Utils.showToast(err.message || 'Login failed', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In to Portal</span><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
      }
    });

    // If already logged in, redirect
    if (Auth.getCurrentUser()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
