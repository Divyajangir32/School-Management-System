<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examination Schedule | Green Valley Public School</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="app-sidebar"></aside>

    <main class="main-content">
      <header class="topbar" id="app-topbar"></header>

      <div class="page-body">
        <div class="page-header">
          <div class="page-header-title">
            <h1>Examinations &amp; Date Sheets</h1>
            <p>Unit Tests, Term Assessments, Pre-Boards &amp; CBSE Annual Examination Schedules</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-primary" id="open-add-exam-btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
              Schedule New Exam
            </button>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-input-wrapper">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="exam-search-input" class="form-control" placeholder="Search by exam title, subject, class...">
          </div>
          <div class="filter-actions">
            <select id="filter-exam-type-select" class="form-control form-select" style="min-width: 190px;">
              <option value="">All Exam Categories</option>
            </select>
            <select id="filter-exam-class-select" class="form-control form-select" style="min-width: 160px;">
              <option value="">All Classes</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Exam Title</th>
                  <th>Category</th>
                  <th>Class / Section</th>
                  <th>Subject</th>
                  <th>Date</th>
                  <th>Timings</th>
                  <th>Max Marks</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="exams-table-body">
                <!-- Injected via exams.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Exam Form Modal -->
  <div class="modal-overlay" id="exam-form-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="exam-modal-title">Schedule New Exam</h3>
        <button type="button" class="modal-close" onclick="Utils.closeModal('exam-form-modal')">&times;</button>
      </div>
      <form id="exam-form">
        <input type="hidden" id="exam-form-id">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="ex-name">Exam Title <span class="required">*</span></label>
            <input type="text" id="ex-name" class="form-control" placeholder="e.g. Half-Yearly Examination 2025" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="ex-type">Exam Category <span class="required">*</span></label>
              <select id="ex-type" class="form-control form-select" required></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="ex-subject">Subject <span class="required">*</span></label>
              <select id="ex-subject" class="form-control form-select" required></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="ex-class">Class <span class="required">*</span></label>
              <select id="ex-class" class="form-control form-select" required></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="ex-section">Section</label>
              <select id="ex-section" class="form-control form-select">
                <option value="A">Section A</option>
                <option value="B">Section B</option>
                <option value="C">Section C</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="ex-date">Exam Date <span class="required">*</span></label>
              <input type="date" id="ex-date" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ex-max-marks">Max Marks <span class="required">*</span></label>
              <input type="number" id="ex-max-marks" class="form-control" min="10" max="100" value="100" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="ex-start-time">Start Time</label>
              <input type="time" id="ex-start-time" class="form-control" value="09:00" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ex-end-time">End Time</label>
              <input type="time" id="ex-end-time" class="form-control" value="12:00" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Utils.closeModal('exam-form-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-exam-btn">Save Examination</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/exams.js"></script>
</body>
</html>
