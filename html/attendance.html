<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Attendance | Green Valley Public School</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .att-btn-group {
      display: inline-flex;
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 3px;
      border: 1px solid var(--border);
    }
    .att-opt-btn {
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: var(--transition);
    }
    .att-opt-btn.present.active { background: #16a34a; color: #fff; }
    .att-opt-btn.absent.active { background: #dc2626; color: #fff; }
    .att-opt-btn.late.active { background: #d97706; color: #fff; }
    .att-opt-btn.leave.active { background: #2563eb; color: #fff; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="app-sidebar"></aside>

    <main class="main-content">
      <header class="topbar" id="app-topbar"></header>

      <div class="page-body">
        <div class="page-header">
          <div class="page-header-title">
            <h1>Student Daily Attendance</h1>
            <p>Roll-call registry, daily attendance tracking &amp; percentage analytics</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-success" id="mark-all-present-btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              Quick: All Present
            </button>
            <button class="btn btn-primary" id="save-attendance-btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
              Save Attendance Sheet
            </button>
          </div>
        </div>

        <!-- Attendance Selector Bar -->
        <div class="filter-bar">
          <div class="filter-actions" style="width: 100%; display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0; min-width: 180px;">
              <label class="form-label" for="att-date-picker">Attendance Date</label>
              <input type="date" id="att-date-picker" class="form-control" required>
            </div>
            <div class="form-group" style="margin-bottom: 0; min-width: 200px;">
              <label class="form-label" for="att-class-select">Select Class</label>
              <select id="att-class-select" class="form-control form-select" required></select>
            </div>
            <div class="form-group" style="margin-bottom: 0; min-width: 140px;">
              <label class="form-label" for="att-section-select">Section</label>
              <select id="att-section-select" class="form-control form-select">
                <option value="A">Section A</option>
                <option value="B">Section B</option>
                <option value="C">Section C</option>
              </select>
            </div>
            <button class="btn btn-secondary" id="load-roster-btn" style="height: 42px;">
              Fetch Class Roster
            </button>
          </div>
        </div>

        <!-- Attendance Stats Counters -->
        <div class="metrics-grid" id="attendance-stats-cards" style="grid-template-columns: repeat(4, 1fr);">
          <!-- Injected via JS -->
        </div>

        <!-- Attendance Roll Sheet Table -->
        <div class="card">
          <div class="card-header">
            <div class="card-title" id="roster-header-title">
              <span>Class Attendance Roster</span>
            </div>
            <div id="roster-date-badge" class="badge badge-neutral"></div>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Roll No</th>
                  <th>Student Name</th>
                  <th>Admission No</th>
                  <th>Historical Attendance %</th>
                  <th style="text-align: center;">Mark Attendance Status</th>
                </tr>
              </thead>
              <tbody id="attendance-table-body">
                <!-- Injected via attendance.js -->
              </tbody>
            </table>
          </div>
          <div class="card-footer" style="justify-content: flex-end;">
            <button class="btn btn-primary" id="save-attendance-btn-bottom">
              Save Attendance Sheet
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/attendance.js"></script>
</body>
</html>
