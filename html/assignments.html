<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments &amp; Homework | Green Valley Public School</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="app-sidebar"></aside>

    <main class="main-content">
      <header class="topbar" id="app-topbar"></header>

      <div class="page-body">
        <div class="page-header">
          <div class="page-header-title">
            <h1>Assignments &amp; Homework</h1>
            <p>Subject coursework, homework deadlines &amp; student submissions</p>
          </div>
          <div class="page-header-actions" id="assignment-actions-container">
            <button class="btn btn-primary" id="open-add-assignment-btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
              Create Assignment
            </button>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-input-wrapper">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="assignment-search-input" class="form-control" placeholder="Search by assignment title, subject, teacher...">
          </div>
          <div class="filter-actions">
            <select id="filter-assignment-class-select" class="form-control form-select" style="min-width: 170px;">
              <option value="">All Classes</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Assignment Title</th>
                  <th>Subject</th>
                  <th>Class</th>
                  <th>Assigned By</th>
                  <th>Due Date</th>
                  <th>Status</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="assignments-table-body">
                <!-- Loaded via assignments.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Assignment Modal -->
  <div class="modal-overlay" id="assignment-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="assignment-modal-title">Create Assignment</h3>
        <button type="button" class="modal-close" onclick="Utils.closeModal('assignment-modal')">&times;</button>
      </div>
      <form id="assignment-form">
        <input type="hidden" id="assignment-form-id">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="asn-title">Assignment Title <span class="required">*</span></label>
            <input type="text" id="asn-title" class="form-control" placeholder="e.g. Chapter 8 Trigonometric Proofs Worksheet" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="asn-subject">Subject <span class="required">*</span></label>
              <select id="asn-subject" class="form-control form-select" required></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="asn-class">Target Class <span class="required">*</span></label>
              <select id="asn-class" class="form-control form-select" required></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="asn-due-date">Submission Due Date <span class="required">*</span></label>
              <input type="date" id="asn-due-date" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="asn-status">Status</label>
              <select id="asn-status" class="form-control form-select">
                <option value="Active">Active</option>
                <option value="Closed">Closed</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="asn-desc">Detailed Instructions / Questions <span class="required">*</span></label>
            <textarea id="asn-desc" class="form-control" rows="4" placeholder="Mention NCERT page numbers, worksheet instructions, or project tasks..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Utils.closeModal('assignment-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-asn-btn">Publish Assignment</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/assignments.js"></script>
</body>
</html>
