<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Management | Green Valley Public School</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="app-sidebar"></aside>

    <main class="main-content">
      <header class="topbar" id="app-topbar"></header>

      <div class="page-body">
        <div class="page-header">
          <div class="page-header-title">
            <h1>Faculty &amp; Teacher Management</h1>
            <p>Teaching staff directory, subject specializations &amp; class teacher allocations</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-outline" id="export-teachers-csv-btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              Export CSV
            </button>
            <button class="btn btn-primary" id="open-add-teacher-modal-btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
              Add Faculty Member
            </button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="search-input-wrapper">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="teacher-search-input" class="form-control" placeholder="Search teacher by name, ID, qualification, phone...">
          </div>
          <div class="filter-actions">
            <select id="filter-subject-select" class="form-control form-select" style="min-width: 170px;">
              <option value="">All Subjects</option>
            </select>
            <select id="filter-status-select" class="form-control form-select" style="min-width: 140px;">
              <option value="">All Statuses</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
            <button class="btn btn-secondary" id="reset-filters-btn">Reset</button>
          </div>
        </div>

        <!-- Teachers Table -->
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Emp ID</th>
                  <th>Faculty Name</th>
                  <th>Subject</th>
                  <th>Assigned Class</th>
                  <th>Qualification</th>
                  <th>Contact</th>
                  <th>Joining Date</th>
                  <th>Status</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="teachers-table-body">
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
          <div class="card-footer" style="justify-content: space-between;">
            <div class="text-muted" style="font-size: 0.85rem;" id="teacher-count-summary">Showing faculty records</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Teacher Add/Edit Modal -->
  <div class="modal-overlay" id="teacher-form-modal">
    <div class="modal-dialog modal-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="teacher-modal-title">Add Faculty Member</h3>
        <button type="button" class="modal-close" onclick="Utils.closeModal('teacher-form-modal')">&times;</button>
      </div>
      <form id="teacher-form">
        <input type="hidden" id="teacher-form-id">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="tea-emp-id">Employee ID <span class="required">*</span></label>
              <input type="text" id="tea-emp-id" class="form-control" placeholder="GVPS-T..." required>
            </div>
            <div class="form-group">
              <label class="form-label" for="tea-name">Full Name <span class="required">*</span></label>
              <input type="text" id="tea-name" class="form-control" placeholder="e.g. Harpreet Singh Sandhu" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="tea-joining-date">Joining Date <span class="required">*</span></label>
              <input type="date" id="tea-joining-date" class="form-control" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="tea-subject">Primary Subject <span class="required">*</span></label>
              <select id="tea-subject" class="form-control form-select" required></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="tea-assigned-class">Assigned Class Teacher</label>
              <select id="tea-assigned-class" class="form-control form-select">
                <option value="">None (Subject Teacher only)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="tea-qualification">Highest Qualification <span class="required">*</span></label>
              <input type="text" id="tea-qualification" class="form-control" placeholder="e.g. M.Sc. Mathematics, B.Ed." required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="tea-phone">Mobile Phone <span class="required">*</span></label>
              <input type="tel" id="tea-phone" class="form-control" placeholder="10-digit Indian phone" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="tea-email">Official Email <span class="required">*</span></label>
              <input type="email" id="tea-email" class="form-control" placeholder="teacher@greenvalleyschool.example" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="tea-status">Status</label>
              <select id="tea-status" class="form-control form-select">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive / On Leave</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="tea-address">Residential Address (Jalandhar)</label>
            <input type="text" id="tea-address" class="form-control" placeholder="e.g. 310, Urban Estate Phase I, Jalandhar">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Utils.closeModal('teacher-form-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-teacher-btn">Save Faculty Details</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Teacher View Modal -->
  <div class="modal-overlay" id="teacher-view-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Faculty Profile</h3>
        <button type="button" class="modal-close" onclick="Utils.closeModal('teacher-view-modal')">&times;</button>
      </div>
      <div class="modal-body" id="teacher-view-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="Utils.closeModal('teacher-view-modal')">Close</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/teachers.js"></script>
</body>
</html>
