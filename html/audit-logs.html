<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Audit Logs | Green Valley Public School</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="app-sidebar"></aside>

    <main class="main-content">
      <header class="topbar" id="app-topbar"></header>

      <div class="page-body">
        <div class="page-header">
          <div class="page-header-title">
            <h1>Security &amp; Authorization Audit Logs</h1>
            <p>Immutable log of high-impact operations, role changes, marks updates &amp; security events</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-outline" id="export-audit-csv-btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              Export Audit Trail
            </button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="search-input-wrapper">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="audit-search-input" class="form-control" placeholder="Search by actor, action, resource, details...">
          </div>
          <div class="filter-actions">
            <select id="filter-audit-role-select" class="form-control form-select" style="min-width: 160px;">
              <option value="">All Roles</option>
              <option value="Super Admin">Super Admin</option>
              <option value="Admin">Admin</option>
              <option value="Principal">Principal</option>
              <option value="Teacher">Teacher</option>
              <option value="Accountant">Accountant</option>
              <option value="Librarian">Librarian</option>
              <option value="Receptionist">Receptionist</option>
              <option value="Student">Student</option>
              <option value="Parent">Parent</option>
            </select>
            <select id="filter-audit-status-select" class="form-control form-select" style="min-width: 140px;">
              <option value="">All Statuses</option>
              <option value="SUCCESS">SUCCESS</option>
              <option value="BLOCKED">BLOCKED</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              <span>Security Event Trail</span>
            </div>
            <span class="badge badge-neutral" id="audit-count-badge">0 Events</span>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Timestamp (IST)</th>
                  <th>Actor / User</th>
                  <th>Role</th>
                  <th>Action Type</th>
                  <th>Target Resource</th>
                  <th>Activity Description</th>
                  <th>Result</th>
                </tr>
              </thead>
              <tbody id="audit-table-body">
                <!-- Loaded via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/audit-logs.js"></script>
</body>
</html>
