<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports &amp; Analytics | Green Valley Public School</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="app-sidebar"></aside>

    <main class="main-content">
      <header class="topbar" id="app-topbar"></header>

      <div class="page-body">
        <div class="page-header no-print">
          <div class="page-header-title">
            <h1>Academic &amp; Administrative Reports</h1>
            <p>Generate printable reports and CSV data exports across all school modules</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-outline" onclick="window.print()">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
              Print Report
            </button>
            <button class="btn btn-primary" id="export-active-report-btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              Export CSV
            </button>
          </div>
        </div>

        <!-- Report Type Selector Bar -->
        <div class="filter-bar no-print">
          <div class="filter-actions" style="width: 100%; display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;">
            <div class="form-group" style="margin-bottom: 0; min-width: 260px;">
              <label class="form-label" for="report-type-select">Select Report Type</label>
              <select id="report-type-select" class="form-control form-select">
                <option value="students">Student Master List (Jalandhar)</option>
                <option value="teachers">Faculty &amp; Staff Directory</option>
                <option value="attendance">Daily Attendance Summary</option>
                <option value="marks">Examination Marks Ledger</option>
                <option value="fees">Fee Collection &amp; Dues Report</option>
                <option value="classes">Class &amp; Capacity Report</option>
              </select>
            </div>
            <button class="btn btn-secondary" id="refresh-report-btn" style="height: 42px;">
              Refresh Report Data
            </button>
          </div>
        </div>

        <!-- Printable Official Report Card Header (shown on print) -->
        <div class="print-only" style="margin-bottom: 24px; text-align: center; border-bottom: 2px solid #000; padding-bottom: 12px;">
          <h2 style="font-size: 1.5rem; color: #064e3b; margin-bottom: 2px;">GREEN VALLEY PUBLIC SCHOOL</h2>
          <div style="font-size: 0.85rem;">Urban Estate Phase II, Jalandhar, Punjab - 144022 &bull; CBSE Affiliation No: 1630892</div>
          <div style="font-weight: 700; margin-top: 6px;" id="print-report-title">OFFICIAL SCHOOL REPORT</div>
        </div>

        <!-- Dynamic Report Table Card -->
        <div class="card">
          <div class="card-header no-print">
            <div class="card-title" id="report-header-title">
              <span>Report Records</span>
            </div>
            <span class="badge badge-info" id="report-records-count">0 Records</span>
          </div>
          <div class="table-responsive">
            <table class="data-table" id="report-table">
              <thead id="report-table-head">
                <!-- Injected via reports.js -->
              </thead>
              <tbody id="report-table-body">
                <!-- Injected via reports.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/reports.js"></script>
</body>
</html>
