<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Management | Green Valley Public School</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="app-sidebar"></aside>

    <main class="main-content">
      <header class="topbar" id="app-topbar"></header>

      <div class="page-body">
        <div class="page-header">
          <div class="page-header-title">
            <h1>Curriculum &amp; Subject Catalog</h1>
            <p>Configurable CBSE subjects, weekly periods, course codes &amp; academic categories</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-primary" id="open-add-subject-btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
              Add New Subject
            </button>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-input-wrapper">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="subject-search-input" class="form-control" placeholder="Search by subject name, code, category...">
          </div>
          <div class="filter-actions">
            <select id="filter-category-select" class="form-control form-select" style="min-width: 180px;">
              <option value="">All Categories</option>
              <option value="Language">Language</option>
              <option value="Core">Core</option>
              <option value="Senior Science">Senior Science</option>
              <option value="Senior Commerce">Senior Commerce</option>
              <option value="Skill">Skill</option>
              <option value="Activity">Activity</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Course Code</th>
                  <th>Subject Name</th>
                  <th>Academic Category</th>
                  <th>Weekly Periods</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="subjects-table-body">
                <!-- Injected via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Subject Modal -->
  <div class="modal-overlay" id="subject-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="subject-modal-title">Add Subject</h3>
        <button type="button" class="modal-close" onclick="Utils.closeModal('subject-modal')">&times;</button>
      </div>
      <form id="subject-form">
        <input type="hidden" id="subject-form-id">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="sub-code">Subject Code <span class="required">*</span></label>
              <input type="text" id="sub-code" class="form-control" placeholder="e.g. MAT-01" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="sub-name">Subject Name <span class="required">*</span></label>
              <input type="text" id="sub-name" class="form-control" placeholder="e.g. Mathematics" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="sub-category">Category <span class="required">*</span></label>
              <select id="sub-category" class="form-control form-select" required>
                <option value="Language">Language (Punjabi, English, Hindi)</option>
                <option value="Core">Core (Maths, Science, Social)</option>
                <option value="Senior Science">Senior Science (Physics, Chem, Bio)</option>
                <option value="Senior Commerce">Senior Commerce (Accounts, Eco, BST)</option>
                <option value="Skill">Skill &amp; Vocational (Computer Science)</option>
                <option value="Activity">Physical Ed &amp; Activity</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="sub-periods">Weekly Periods</label>
              <input type="number" id="sub-periods" class="form-control" min="1" max="12" value="6" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Utils.closeModal('subject-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-sub-btn">Save Subject</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/permissions.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/subjects.js"></script>
</body>
</html>
