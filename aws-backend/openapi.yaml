openapi: 3.0.1
info:
  title: Green Valley Public School Management System API
  description: |
    REST API Gateway for School Management System in Urban Estate Phase II, Jalandhar, Punjab, India.
    Includes comprehensive Role-Based Access Control (RBAC) enforced via Amazon Cognito and AWS Lambda.
    Roles: Super Admin, Admin, Principal, Teacher, Student, Parent, Accountant, Librarian, Receptionist.
  version: 2.0.0
components:
  securitySchemes:
    CognitoAuth:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Cognito JWT Bearer token with custom:role and cognito:groups claims.

security:
  - CognitoAuth: []

paths:
  /students:
    get:
      summary: List students (Scoped by role)
      description: Returns all students for Admin/Principal/Receptionist; assigned class students only for Teacher; own profile only for Student; linked children only for Parent.
      responses:
        '200':
          description: List of students
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      summary: Register new student (Admin, Receptionist, Super Admin only)
      responses:
        '201':
          description: Student created
        '403':
          description: Forbidden
  /students/{id}:
    get:
      summary: Retrieve student by ID (Subject to student/parent relationship checks)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student found
        '404':
          description: Not found
    put:
      summary: Update student record (Admin, Principal, Super Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student updated
    delete:
      summary: Delete or deactivate student (Admin, Super Admin only; logged in Audit Trail)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student deleted

  /teachers:
    get:
      summary: List faculty members
      responses:
        '200':
          description: List of teachers
    post:
      summary: Add faculty member (Admin, Principal, Super Admin only)
      responses:
        '201':
          description: Teacher created
  /teachers/{id}:
    put:
      summary: Update teacher record (Admin, Principal, Super Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Teacher updated
    delete:
      summary: Delete teacher record (Admin, Super Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Teacher deleted

  /attendance:
    get:
      summary: Get attendance records (Scoped by role: Teacher sees assigned class, Student/Parent sees own)
      responses:
        '200':
          description: Attendance list
    post:
      summary: Record attendance batch (Teacher, Admin, Principal only)
      responses:
        '201':
          description: Attendance saved

  /marks:
    get:
      summary: Get examination marks (Scoped by role: Teacher sees assigned subject/class, Student/Parent sees own)
      responses:
        '200':
          description: Marks records
    post:
      summary: Submit marks entries (Teacher for assigned subject, Admin, Principal only)
      responses:
        '201':
          description: Marks saved

  /fees:
    get:
      summary: Retrieve fee records (Accountant, Admin, Principal, Super Admin; Student/Parent sees own invoice only)
      responses:
        '200':
          description: Fee records
    post:
      summary: Record payment or create fee demand (Accountant, Admin, Super Admin only)
      responses:
        '201':
          description: Fee recorded

  /announcements:
    get:
      summary: List notices and circulars (Targeted by audience or public)
      responses:
        '200':
          description: Announcements
    post:
      summary: Publish announcement (Admin, Principal, Super Admin, Teacher for class)
      responses:
        '201':
          description: Announcement published

  /users:
    get:
      summary: List user accounts (Super Admin and Admin only)
      responses:
        '200':
          description: User directory
        '403':
          description: Forbidden
    post:
      summary: Create new system user account (Super Admin, Admin)
      responses:
        '201':
          description: User created
        '403':
          description: Forbidden
  /users/{id}:
    get:
      summary: Get user details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
    put:
      summary: Update user account or change role (Super Admin or Admin; Admin cannot modify Super Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User updated
        '403':
          description: Forbidden
    delete:
      summary: Delete or disable user account (Protected against Super Admin deletion)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted

  /audit-logs:
    get:
      summary: Retrieve security and permission audit events (Super Admin, Admin only)
      responses:
        '200':
          description: Audit logs ordered descending by timestamp
        '403':
          description: Forbidden
    post:
      summary: Record security audit event (Internal / Authorized handlers)
      responses:
        '201':
          description: Audit log recorded

  /library:
    get:
      summary: Get library books catalog or borrowing records
      responses:
        '200':
          description: Library catalog
    post:
      summary: Add book or issue transaction (Librarian, Super Admin, Admin only)
      responses:
        '201':
          description: Library record created
  /library/{id}:
    put:
      summary: Update book or mark return (Librarian, Super Admin, Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Library record updated
    delete:
      summary: Remove book from inventory (Librarian, Super Admin, Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book removed
